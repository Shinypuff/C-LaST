[project]
name = "smoothncde"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "aeon>=1.2.0",
    "autoroot>=1.0.1",
    "datasets>=2.14.4",
    "fairscale>=0.4.13",
    "funcy>=2.0",
    "gdown>=5.2.0",
    "hydra-core>=1.3.2",
    "ipywidgets>=8.1.7",
    "lightgbm>=4.6.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "mlflow>=3.3.2",
    "ninja>=1.11.1.4",
    "notebook>=7.4.2",
    "pandas>=2.2.3",
    "polars==1.33.0",
    "pytorch-lightning>=2.4.0",
    "ruff>=0.11.11",
    "scipy>=1.15.3",
    "torch~=2.8.0",
    "torchao>=0.11.0",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.7.1",
    "torchode>=1.0.0",
    "torchtune>=0.6.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff.lint]
extend-select = ["I", "D"]
