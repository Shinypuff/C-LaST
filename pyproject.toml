dependencies = [
    "aeon>=1.2.0",
    "autoroot>=1.0.1",
    "datasets>=2.14.4",
    "fairscale>=0.4.13",
    "funcy>=2.0",
    "hydra-core>=1.3.2",
    "ipywidgets>=8.1.7",
    "lightgbm>=4.6.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "mlflow>=2.22.0",
    "notebook>=7.4.2",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "polars>=1.30.0",
    "pytorch-lightning>=2.5.1.post0",
    "ruff>=0.11.11",
    "scipy>=1.15.3",
    "signatory>=1.2.6.1.9.0",
    "tensordict>=0.8.3",
    "torch>=2.7.0",
    "torchao>=0.11.0",
    "torchcde>=0.2.5",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.7.1",
    "torchode>=1.0.0",
    "torchtune>=0.6.1",
]

[tool.uv]
