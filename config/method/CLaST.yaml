# @package _global_

method:
  _target_: src.methods.CLaST.CLaSTForecaster
  var_num: 1  
  hidden_dim: 64  
  dropout: 0.1
  lr: 1e-3
  loss_args:
    alpha: 0.8
    temporal_unit: 0
    tau: 0.1
    G_type: ar
    decay_type: gaussian
    k: 1
  backbone: transformer #feednet or transformer
  # backbone_args:
  #   d_ff: 128
  #   dropout: 0.3

patience: 20
trainer_args:
  max_epochs: 1
  
# Конфиг-файл глобального уровня, с package global
# тут можно указать любые параметры, в частности 
# тут удобно менять  обучения (patience, check_val_every_n_epoch).