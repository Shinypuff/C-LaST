defaults:
 - _self_
 - benchmark: etth1s
 - method: LaST

benchmark: etth1s
trainer_args:
  max_epochs: 100
  devices: [3]
  default_root_dir: "/app/checkpoints"

patience: 10
train_batch_size: 32
eval_batch_size: 512
num_workers: 16
seed: 0

# Metrics aren't unscaled in K2VaE
unscale_metrics: false

hydra:
  job:
    chdir: false
